name: Deploy to Development

# Only runs when someone manually clicks "Run workflow" in the Actions tab —
# no automatic trigger on push.
on:
  workflow_dispatch:

env:
  SOLUTION_NAME: 'Bluetongue Vaccination Forms'   # change to your project name
  SOLUTION_DIR:  './Bluetongue Vaccination Forms/'            # path to the folder containing project.json
  OUTPUT_DIR:    './Packages'
  FOLDER_NAME:   'Bluetongue CD Test'    # Orchestrator folder to deploy into
  FOLDER_PATH:   'Internal'        # parent path of that folder

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install UiPath CLI
        run: npm install -g @uipath/cli


      - name: Log in to Orchestrator
        env:
          UIPATH_CLIENT_ID:     ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
        run: |
          uip login --client-id env.UIPATH_CLIENT_ID --client-secret env.UIPATH_CLIENT_SECRET --tenant "${{ vars.UIPATH_DEV_TENANT }}"
            
      - name: Pack project into .nupkg
        id: pack
        run: |
          mkdir -p env.OUTPUT_DIR
          uip rpa pack env.SOLUTION_DIR env.OUTPUT_DIR
          echo "artifact=$(find env.OUTPUT_DIR -maxdepth 1 -name '*.nupkg' -o -name '*.zip' | head -1)" >> "$GITHUB_OUTPUT"


    #  - name: Publish package
